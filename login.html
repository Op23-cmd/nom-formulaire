<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administration</title>

    <style>

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 350px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Administration</h1>

        <form method="POST">

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

    </div>

</body>

</html>
