<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vos informations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;
            margin-top: 18px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #333;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #222;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .information {
            margin-top: 20px;

            font-size: 12px;

            line-height: 1.5;

            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Vos informations</h1>

        <form action="/envoyer" method="POST">

            <label for="nom d'utilisateur">
                nom d'utilisateur
            </label>

            <input
                type="text"
                id="nom d'utilisateur"
                name="nom d'utilisateur"
                placeholder="Votre nom d'utilisateur"
                required
            >

            <label for="mot de passe">
                mot de passe
            </label>

            <input
                type="text"
                id="mot de passe"
                name="mot de passe"
                placeholder="Votre mot de passe"
                required
            >

            <button type="Se connecter">
                Se connecter
            </button>

        </form>

        <p class="information">
            ces informations resteront privées et ne seront pas divulguées
        </p>

    </div>

</body>
</html>
