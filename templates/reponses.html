<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Réponses</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            margin-top: 0;
        }

        .personne {
            padding: 15px;
            margin-top: 10px;
            background: #f5f5f5;
            border-radius: 7px;
        }

        .code {
            margin-top: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        .deconnexion {
            display: inline-block;
            margin-top: 25px;
            color: #222;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Personnes enregistrées</h1>

        {% if personnes %}

            {% for personne in personnes %}

                <div class="personne">

                    <strong>
                        {{ personne[1] }}
                        {{ personne[2] }}
                    </strong>

                    <div class="code">
                        Code du jeu :
                        {{ personne[3] or "Pas encore renseigné" }}
                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p>
                Aucune personne n'a encore rempli
                le formulaire.
            </p>

        {% endif %}

        <a
            class="deconnexion"
            href="/deconnexion"
        >
            Se déconnecter
        </a>

    </div>

</body>

</html>
